<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking Nacional — Lula Simulator</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

  <!-- Estilos Globais Organizados -->
  <link rel="stylesheet" href="css/styles.css">

  <style>
    .page {
      max-width: 820px;
      margin: 0 auto;
      padding: 100px 24px 60px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .page-header h1 {
      font-family: 'Bangers', cursive;
      font-size: 60px;
      letter-spacing: 3px;
      background: linear-gradient(135deg, var(--amarelo-brasil), var(--verde-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .page-header p {
      color: var(--text-muted);
      font-size: 16px;
    }

    .player-section {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .player-section input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 12px 18px;
      color: #ffffff;
      font-size: 15px;
      font-family: inherit;
    }

    .player-section input:focus {
      outline: none;
      border-color: var(--amarelo-brasil);
    }

    .tab-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-muted);
      font-family: 'Bangers', cursive;
      font-size: 20px;
      letter-spacing: 1px;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(255, 223, 0, 0.15);
      border-color: var(--amarelo-brasil);
      color: var(--amarelo-brasil);
    }

    .ranking-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      overflow: hidden;
    }

    .ranking-row {
      display: grid;
      grid-template-columns: 60px 1fr 140px;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      align-items: center;
    }

    .ranking-row:last-child { border-bottom: none; }

    .rank-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bangers', cursive;
      font-size: 18px;
    }

    .rank-1 { background: #ffd700; color: #000; font-weight: bold; }
    .rank-2 { background: #c0c0c0; color: #000; }
    .rank-3 { background: #cd7f32; color: #000; }
    .rank-other { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }

    .score-val {
      font-family: 'Bangers', cursive;
      font-size: 24px;
      color: var(--amarelo-brasil);
      text-align: right;
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGAÇÃO SUPERIOR -->
  <nav>
    <a href="index.html" class="nav-brand">🇧🇷 LULA SIMULATOR</a>
    <ul class="nav-links">
      <li><a href="index.html">Início</a></li>
      <li><a href="jogo.html">🐦 Flappy Lula</a></li>
      <li><a href="correr.html">🏃 Empresário 3D</a></li>
      <li><a href="conquistas.html">🏅 Conquistas</a></li>
      <li><a href="ranking.html" class="active">🏆 Ranking</a></li>
      <li><a href="feedback.html">⭐ Feedbacks</a></li>
      <li><a href="contato.html">📬 Contato</a></li>
    </ul>
  </nav>

  <div class="page">
    <div class="page-header">
      <h1>🏆 RANKING NACIONAL</h1>
      <p>Os maiores jogadores do Brasil no Firebase Firestore!</p>
    </div>

    <!-- SEÇÃO DO APELIDO -->
    <div class="player-section card">
      <label style="font-weight: 700; color: var(--amarelo-brasil);">🎮 Seu Apelido:</label>
      <input type="text" id="playerNameInput" placeholder="Ex: Empresário_BR" maxlength="24">
      <button class="btn-primary" style="font-size: 18px; padding: 10px 24px;" onclick="saveName()">Salvar</button>
    </div>

    <!-- ABAS FLAPPY vs RUNNER 3D -->
    <div class="tab-buttons">
      <button class="tab-btn active" id="tabFlappy" onclick="switchTab('flappy')">🐦 Flappy Lula (Picanhas)</button>
      <button class="tab-btn" id="tabRunner" onclick="switchTab('runner')">🏃 Empresário 3D (KM)</button>
    </div>

    <!-- TABELA DE RANKING -->
    <div class="ranking-card">
      <div id="rankingList" style="padding: 10px 0;">
        <div style="text-align: center; padding: 40px; color: var(--text-muted);">Carregando placar do Firebase... 🇧🇷</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { getTopScores } from './js/firebase-config.js';
    import { auth } from './js/auth.js';

    // Renderiza badge no cabeçalho
    auth.renderProfileBadge('nav');

    const currentUser = auth.getCurrentUser();
    const nameInput = document.getElementById('playerNameInput');
    if (nameInput) {
      nameInput.value = currentUser ? currentUser.username : (localStorage.getItem('lula_player') || '');
    }

    window.saveName = function() {
      auth.mountAuthModal(() => {
        auth.renderProfileBadge('nav');
        const user = auth.getCurrentUser();
        if (user && nameInput) nameInput.value = user.username;
        loadRankingData();
      });
    };

    let currentTab = 'flappy';

    window.switchTab = function(tab) {
      currentTab = tab;
      document.getElementById('tabFlappy').classList.toggle('active', tab === 'flappy');
      document.getElementById('tabRunner').classList.toggle('active', tab === 'runner');
      loadRankingData();
    };

    async function loadRankingData() {
      const container = document.getElementById('rankingList');
      const collectionName = currentTab === 'runner' ? 'lula_runner_scores_v2' : 'lula_scores_v2';
      const unit = currentTab === 'runner' ? 'km' : 'picanhas';

      container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Consultando banco de dados... 🇧🇷</div>';

      let scores = await getTopScores(collectionName, 15);

      // Fallback local da conta atual se vazio
      if (scores.length === 0) {
        const u = auth.getCurrentUser();
        if (u) {
          const val = currentTab === 'runner' ? (u.runnerScore || 0) : (u.flappyScore || 0);
          if (val > 0) {
            scores = [{ player: u.username, score: val }];
          }
        }
      }

      if (scores.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            Placar reiniciado! Seja o primeiro a jogar e garantir seu nome no topo do ranking! 🚀
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      scores.forEach((item, i) => {
        const row = document.createElement('div');
        row.className = 'ranking-row';

        const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : 'rank-other';
        const badge = i === 0 ? '👑' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}`;

        row.innerHTML = `
          <div><span class="rank-badge ${rankClass}">${badge}</span></div>
          <div style="font-weight:700; font-size:16px;">👤 ${item.player || 'Anônimo'}</div>
          <div class="score-val">${item.score} <small style="font-size:12px; color:var(--text-muted);">${unit}</small></div>
        `;
        container.appendChild(row);
      });
    }

    loadRankingData();
  </script>

</body>
</html>
