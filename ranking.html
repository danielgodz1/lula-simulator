<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking Geral — Lula Simulator</title>
  <meta name="description" content="Confira o ranking completo de todos os jogadores de Flappy Lula e Empresário 3D!">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

  <!-- Estilos Globais -->
  <link rel="stylesheet" href="css/styles.css">

  <style>
    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 90px 16px 60px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .page-header h1 {
      font-family: 'Bangers', cursive;
      font-size: 52px;
      letter-spacing: 2px;
      color: var(--amarelo-brasil);
      margin-bottom: 6px;
    }

    .page-header p {
      color: var(--text-muted);
      font-size: 15px;
    }

    .player-section {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      background: rgba(22, 27, 38, 0.8);
      border: 1.5px solid var(--amarelo-brasil);
      border-radius: 16px;
      padding: 12px 18px;
    }

    .player-section input {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 8px 14px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      min-width: 220px;
    }

    .player-section input:focus {
      border-color: var(--verde-neon);
    }

    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      justify-content: center;
    }

    .tab-btn {
      flex: 1;
      max-width: 320px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid transparent;
      color: var(--text-muted);
      font-family: 'Bangers', cursive;
      font-size: 20px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .tab-btn.active {
      background: rgba(255, 223, 0, 0.12);
      border-color: var(--amarelo-brasil);
      color: var(--amarelo-brasil);
      box-shadow: 0 0 20px rgba(255, 223, 0, 0.25);
    }

    .search-bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background: rgba(0, 0, 0, 0.4);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--amarelo-brasil);
    }

    .total-count-badge {
      background: rgba(0, 230, 118, 0.15);
      border: 1px solid var(--verde-neon);
      color: var(--verde-neon);
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .ranking-card {
      background: rgba(22, 27, 38, 0.95);
      border: 2px solid var(--border-card);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }

    .ranking-row {
      display: grid;
      grid-template-columns: 50px 1fr 140px;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.15s ease;
    }

    .ranking-row:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .ranking-row:last-child {
      border-bottom: none;
    }

    .rank-badge {
      font-family: 'Press Start 2P', 'Bangers', cursive;
      font-size: 13px;
      text-align: center;
      display: inline-block;
      width: 32px;
    }

    .rank-1 { color: #ffd700; font-size: 18px; }
    .rank-2 { color: #c0c0c0; font-size: 17px; }
    .rank-3 { color: #cd7f32; font-size: 16px; }
    .rank-other { color: var(--text-muted); font-size: 11px; }

    .score-val {
      font-family: 'Press Start 2P', 'Bangers', cursive;
      font-size: 14px;
      color: var(--verde-neon);
      text-align: right;
    }

    @media (max-width: 600px) {
      .ranking-row {
        grid-template-columns: 36px 1fr 100px;
        padding: 10px 12px;
      }
      .score-val {
        font-size: 11px;
      }
      .page-header h1 {
        font-size: 38px;
      }
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGAÇÃO SUPERIOR -->
  <nav>
    <a href="index.html" class="nav-brand">🇧🇷 LULA SIMULATOR</a>
    <ul class="nav-links" id="navLinksList">
      <li><a href="index.html">Início</a></li>
      <li><a href="jogo.html">🐦 Flappy Lula</a></li>
      <li><a href="correr.html">🏃 Empresário 3D</a></li>
      <li><a href="conquistas.html">🏅 Conquistas</a></li>
      <li><a href="ranking.html" class="active">🏆 Ranking</a></li>
      <li><a href="feedback.html">⭐ Feedbacks</a></li>
      <li><a href="contato.html">📬 Contato</a></li>
    </ul>
  </nav>

  <div class="page">
    <div class="page-header">
      <h1>🏆 RANKING NACIONAL</h1>
      <p>Confira a lista completa de todos os jogadores classificados!</p>
    </div>

    <!-- SEÇÃO DO APELIDO DO JOGADOR -->
    <div class="player-section">
      <label style="font-weight: 700; color: var(--amarelo-brasil); font-size:14px;">🎮 Seu Apelido:</label>
      <input type="text" id="playerNameInput" placeholder="Ex: Empresário_BR" maxlength="25">
      <button class="btn-primary" style="font-size: 15px; padding: 7px 18px;" id="btnSaveName">Salvar</button>
    </div>

    <!-- ABAS FLAPPY vs RUNNER 3D -->
    <div class="tab-buttons">
      <button class="tab-btn active" id="tabFlappy">🐦 Flappy Lula (Picanhas)</button>
      <button class="tab-btn" id="tabRunner">🏃 Empresário 3D (KM)</button>
    </div>

    <!-- BARRA DE BUSCA E CONTADOR DE JOGADORES -->
    <div class="search-bar-row">
      <input type="text" id="searchRankingInput" class="search-input" placeholder="🔍 Buscar jogador (ex: Victor, Duda, Daniel)...">
      <div id="totalPlayersBadge" class="total-count-badge">Carregando jogadores...</div>
    </div>

    <!-- TABELA DE RANKING COM TODOS OS JOGADORES -->
    <div class="ranking-card">
      <div id="rankingList" style="padding: 6px 0;">
        <div style="text-align: center; padding: 40px; color: var(--text-muted);">Consultando banco de dados seguro... 🇧🇷</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { getTopScores } from './js/firebase-config.js';
    import { auth } from './js/auth.js';
    import { escapeHTML } from './js/security.js';

    auth.renderProfileBadge('nav');

    let currentTab = 'flappy';
    let allCurrentScores = [];

    const cur = auth.getCurrentUser();
    if (cur && cur.username) {
      document.getElementById('playerNameInput').value = cur.username;
    } else {
      const savedName = localStorage.getItem('lula_player');
      if (savedName) document.getElementById('playerNameInput').value = savedName;
    }

    document.getElementById('btnSaveName').onclick = async function() {
      const input = document.getElementById('playerNameInput');
      const name = (input.value || '').trim();
      if (!name || name.length < 2) {
        alert('Por favor digite um apelido válido!');
        return;
      }
      localStorage.setItem('lula_player', name);
      if (auth.getCurrentUser()) {
        auth.getCurrentUser().username = name;
      }
      auth.renderProfileBadge('nav');
      alert(`Apelido salvo como "${name}"!`);
      loadRankingData();
    };

    document.getElementById('tabFlappy').onclick = () => switchTab('flappy');
    document.getElementById('tabRunner').onclick = () => switchTab('runner');

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabFlappy').className = `tab-btn ${tab === 'flappy' ? 'active' : ''}`;
      document.getElementById('tabRunner').className = `tab-btn ${tab === 'runner' ? 'active' : ''}`;
      document.getElementById('searchRankingInput').value = '';
      loadRankingData();
    }

    async function loadRankingData() {
      const container = document.getElementById('rankingList');
      const totalBadge = document.getElementById('totalPlayersBadge');
      container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">Carregando todos os jogadores... 🇧🇷</div>';

      const collection = currentTab === 'runner' ? 'lula_runner_scores_v2' : 'lula_scores_v2';
      
      // Busca todos os jogadores (sem limite curto de 15)
      allCurrentScores = await getTopScores(collection, 300);

      // Fallback da conta atual caso banco esteja vazio
      if (allCurrentScores.length === 0) {
        const u = auth.getCurrentUser();
        if (u) {
          const val = currentTab === 'runner' ? (u.runnerScore || 0) : (u.flappyScore || 0);
          if (val > 0) {
            allCurrentScores = [{ player: u.username, score: val }];
          }
        }
      }

      totalBadge.textContent = `Total: ${allCurrentScores.length} Jogadores`;
      renderFilteredScores();
    }

    function renderFilteredScores() {
      const container = document.getElementById('rankingList');
      const searchTerm = (document.getElementById('searchRankingInput').value || '').trim().toLowerCase();
      const unit = currentTab === 'runner' ? 'km' : '🥩';

      let filtered = allCurrentScores;
      if (searchTerm) {
        filtered = allCurrentScores.filter(item => (item.player || '').toLowerCase().includes(searchTerm));
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 36px; color: var(--text-muted); font-size:14px;">
            ${searchTerm ? `Nenhum jogador encontrado com o nome "${escapeHTML(searchTerm)}"` : 'Nenhum jogador pontuou ainda. Seja o primeiro! 🚀'}
          </div>
        `;
        return;
      }

      container.innerHTML = '';
      filtered.forEach((item) => {
        // Encontra o rank original no ranking completo
        const originalRank = allCurrentScores.findIndex(s => s.player === item.player && s.score === item.score);
        const rankIdx = originalRank !== -1 ? originalRank : 0;

        const row = document.createElement('div');
        row.className = 'ranking-row';

        const rankClass = rankIdx === 0 ? 'rank-1' : rankIdx === 1 ? 'rank-2' : rankIdx === 2 ? 'rank-3' : 'rank-other';
        const badge = rankIdx === 0 ? '👑' : rankIdx === 1 ? '🥈' : rankIdx === 2 ? '🥉' : `${rankIdx + 1}º`;
        const safePlayer = escapeHTML(item.player || 'Anônimo');
        const safeScore = parseInt(item.score || 0, 10);

        row.innerHTML = `
          <div><span class="rank-badge ${rankClass}">${badge}</span></div>
          <div style="font-weight:700; font-size:15px; color:#fff;">👤 ${safePlayer}</div>
          <div class="score-val">${safeScore} <small style="font-size:10px; color:var(--text-muted);">${unit}</small></div>
        `;
        container.appendChild(row);
      });
    }

    document.getElementById('searchRankingInput').addEventListener('input', renderFilteredScores);

    loadRankingData();
  </script>

</body>
</html>
