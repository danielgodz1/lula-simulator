<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Publicidade</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
  </style>
</head>
<body>
  <script>
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const format = params.get('format') || '320x50';

        const CONFIGS = {
          '160x600': {
            key: 'dda14d693428bdb35d633d7f7c78c2cd',
            width: 160,
            height: 600,
            scriptUrl: 'https://www.highrevenueformat.com/dda14d693428bdb35d633d7f7c78c2cd/invoke.js'
          },
          '320x50': {
            key: '590c47d997603e6ea80ae7b922875e55',
            width: 320,
            height: 50,
            scriptUrl: 'https://www.highrevenueformat.com/590c47d997603e6ea80ae7b922875e55/invoke.js'
          }
        };

        const cfg = CONFIGS[format] || CONFIGS['320x50'];

        window.atOptions = {
          'key': cfg.key,
          'format': 'iframe',
          'height': cfg.height,
          'width': cfg.width,
          'params': {}
        };

        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = cfg.scriptUrl;
        document.body.appendChild(script);
      } catch (err) {
        console.warn('Falha no carregamento do frame de anúncio:', err);
      }
    })();
  </script>
</body>
</html>
